name: afa

# No host ports are published here on purpose — see docker-compose.override.yml
# (auto-loaded by plain `docker compose up`, restoring today's exact local-dev
# behavior) and docker-compose.production.yml (explicit `-f` overlay: closes
# Postgres/Redis to the internet, fronts api/telegram-bot with Caddy instead
# of publishing their ports directly). This file is the shared base only.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: afa_owner
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: afa
    volumes:
      - afa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afa_owner -d afa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # `depends_on` is deliberately NOT set here — Compose's map-shaped
  # `depends_on` merges per-key across -f overlays rather than being
  # replaceable/clearable by one, so any base-level entry would still start
  # a dependency an overlay never wants (see docker-compose.production.yml's
  # own comment: this project's production deployment uses Supabase, never
  # this file's own `postgres` service — a base-level `depends_on: postgres`
  # was previously starting it anyway on every `up -d api/telegram-bot/worker`,
  # confirmed wasting real, scarce RAM on a 1GB droplet). Each environment
  # declares the dependency set it actually wants:
  # docker-compose.override.yml (local dev, postgres + redis) or
  # docker-compose.production.yml (production, redis only).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    env_file:
      - apps/telegram-bot/.env

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - apps/worker/.env

volumes:
  afa-postgres-data:
