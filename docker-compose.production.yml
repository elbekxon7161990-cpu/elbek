# Production overlay — explicit, never auto-loaded:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Layers on top of docker-compose.yml (never docker-compose.override.yml,
# which is local-dev-only and must not be combined with this file). Adds:
#   - restart policy, bounded log growth, and a conservative resource ceiling
#     per service (deploy.resources.limits — respected by plain `docker
#     compose up` under Compose V2, no Swarm mode required)
#   - Caddy, terminating HTTPS on :80/:443 and reverse-proxying to
#     api/telegram-bot over the internal Compose network — api and
#     telegram-bot get NO host port here at all; Caddy is the only service
#     reachable from outside the droplet besides SSH
# Postgres/Redis get no host port either — nothing outside this Compose
# network needs to reach them directly in production (see the deployment
# audit: closing 5432/6379 to the internet was a HIGH-severity finding).
#
# Sizing is a starting baseline for a single DigitalOcean droplet running all
# five services together, not a measured/load-tested number — revisit once
# real traffic/queue-depth data exists.

services:
  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  redis:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  api:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  telegram-bot:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  worker:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - telegram-bot
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

volumes:
  caddy-data:
  caddy-config:
