# Production overlay — explicit, never auto-loaded:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Layers on top of docker-compose.yml (never docker-compose.override.yml,
# which is local-dev-only and must not be combined with this file). Adds:
#   - restart policy, bounded log growth, and a conservative resource ceiling
#     per service (deploy.resources.limits — respected by plain `docker
#     compose up` under Compose V2, no Swarm mode required)
#   - `api` binds its host port to 127.0.0.1 only (never 0.0.0.0) — the
#     actual target deployment host already runs its own native (non-Docker)
#     nginx + Certbot for an unrelated pre-existing domain and permanently
#     owns 80/443, so the originally-planned Caddy reverse proxy (see git
#     history — a `caddy` service used to live in this file) can never bind
#     those ports on this host and was removed; nginx itself reverse-proxies
#     the web admin panel to this loopback-only port instead (a separate
#     nginx site block, outside this repo — see the deployment's own runbook
#     notes). telegram-bot needs no such binding: it only receives inbound
#     Telegram traffic via long-polling, not a reverse-proxied webhook, on
#     this deployment.
# Postgres/Redis get no host port either — nothing outside this Compose
# network needs to reach them directly in production (see the deployment
# audit: closing 5432/6379 to the internet was a HIGH-severity finding).
#
# Sizing is a starting baseline for a single DigitalOcean droplet running all
# five services together, not a measured/load-tested number — revisit once
# real traffic/queue-depth data exists.

services:
  postgres:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  redis:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  # `depends_on: redis` only — never `postgres`. This deployment uses
  # Supabase; docker-compose.yml's own `postgres` service is not part of it.
  # Confirmed on the real target: a base-level `depends_on: postgres` used
  # to start that container on every `up -d api/telegram-bot/worker` anyway,
  # wasting real RAM on a 1GB droplet already under memory pressure.
  api:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3000'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  telegram-bot:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

  worker:
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512m

